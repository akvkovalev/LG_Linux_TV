Section "ServerLayout"
    Identifier "LGTV"
    Screen 0 "Screen0"
EndSection
Section "Device"
    Identifier "RealtekFB"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection
Section "Monitor"
    Identifier "Panel"
    HorizSync 20-90
    VertRefresh 50-75
EndSection
Section "Screen"
    Identifier "Screen0"
    Device "RealtekFB"
    Monitor "Panel"
    DefaultDepth 16
    SubSection "Display"
        Depth 16
    EndSubSection
EndSection
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "DontVTSwitch" "true"
    Option "AllowMouseOpenFail" "true"
EndSection
